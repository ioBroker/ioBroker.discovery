# Does every adapter discovery can propose still exist in the latest repository? (#508)
#
# The build asks the same, but only when something is pushed. An adapter that leaves the
# repository between two releases shows up here instead: as an issue, which is updated while the
# list changes and closed once it is empty again.

name: Check proposed adapters

on:
  schedule:
    # Mondays, 05:17 UTC
    - cron: '17 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    # A fork has no business opening issues about this repository
    if: github.repository == 'ioBroker/ioBroker.discovery'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: npm ci

      - name: Compare the proposed adapters with the latest repository
        id: check
        run: |
          set +e
          node scripts/proposedAdapters.js --report report.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 2: the repository did not answer - that says nothing about the adapters, so no
          # issue is touched, but the run shows red
          [ "$code" -ne 2 ]

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CODE: ${{ steps.check.outputs.code }}
        run: |
          title='Proposed adapters missing from the ioBroker repository'
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)

          if [ "$CODE" = "1" ]; then
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file report.md
            elif [ "$(gh issue view "$number" --json body --jq .body)" != "$(cat report.md)" ]; then
              gh issue edit "$number" --body-file report.md
              gh issue comment "$number" --body "The list has changed, see the description."
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every proposed adapter is in the repository again."
          fi
